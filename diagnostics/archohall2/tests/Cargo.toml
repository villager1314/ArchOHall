[package]
name = "archohall-profile-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Compile the real provisioning module without Android/desktop build dependencies.
[lib]
path = "harness.rs"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tar = "0.4"
tempfile = "3"
xz2 = { version = "0.1", features = ["static"] }
zstd = { version = "0.13", default-features = false }

[workspace]
