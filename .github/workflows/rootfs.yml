name: Build ArchOHall rootfs
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a prerelease after a successful build
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/rootfs.yml', 'scripts/**', 'rootfs/**', 'packages.txt']
permissions:
  contents: read
concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg xz-utils shellcheck
      - name: Check shell scripts
        run: |
          find scripts rootfs/usr/local/bin -type f -print0 | xargs -0 -n1 bash -n
          shellcheck scripts/*.sh rootfs/usr/local/bin/*
      - name: Build signed-upstream ARM64 rootfs
        run: sudo --preserve-env=GITHUB_SHA bash scripts/build-rootfs.sh
      - name: Upload install bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archohall-aarch64-${{ github.run_number }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          cat dist/build-info.txt >> "$GITHUB_STEP_SUMMARY"
          du -h dist/* >> "$GITHUB_STEP_SUMMARY"
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: archohall-aarch64-${{ github.run_number }}
          path: dist
      - name: Publish experimental image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh release create "rootfs-${BUILD_NUMBER}-${BUILD_ATTEMPT}" dist/* \
            --target "$BUILD_SHA" --prerelease \
            --title "ArchOHall ARM64 experimental build ${BUILD_NUMBER}" \
            --notes '预装 Arch Linux ARM + Plasma Mobile 的 PRoot rootfs。默认软件渲染。CI 检查安装、动态链接与归档完整性，不代表已通过 Android 图形、触摸或 GPU 实机测试。使用方法见仓库 README。'
