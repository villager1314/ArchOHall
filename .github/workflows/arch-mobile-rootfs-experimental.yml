name: Arch Mobile experimental rootfs (reuse KWin)
on:
  push:
    branches: [experiment/portal-arch-mobile-build]
    paths: ['diagnostics/arch-mobile-rootfs/**', '.github/workflows/arch-mobile-rootfs-experimental.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: arch-mobile-rootfs-experimental
  cancel-in-progress: false
jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check private build namespace support before downloads
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --mount --pid --fork --kill-child --propagation private \
            /bin/bash -euc 'mount --make-rprivate /; test "$$" = 1'
      - name: Reuse successful KWin artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arch-mobile-kwin-diagnostic-41162670069
          run-id: 41162670069
          github-token: ${{ github.token }}
          path: kwin-artifact
      - name: Restore installed desktop checkpoint
        id: desktop-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .rootfs-checkpoint
          key: arch-mobile-desktop-aarch64-v1-${{ hashFiles('diagnostics/arch-mobile-rootfs/install-dependencies.sh', 'diagnostics/arch-mobile-rootfs/verify-packages.py', 'diagnostics/arch-mobile-ci/package-candidate.json') }}
      - name: Restore existing package cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build-cache
          key: arch-mobile-aarch64-v1-${{ hashFiles('diagnostics/arch-mobile-ci/package-candidate.json') }}-rootfs-${{ github.run_id }}
          restore-keys: |
            arch-mobile-aarch64-v1-${{ hashFiles('diagnostics/arch-mobile-ci/package-candidate.json') }}-
      - name: Prepare rootfs and verify reused binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rootfs input out .build-cache/pacman
          archive=$(find kwin-artifact -name kwin-6.8.2-anland-arm64-experimental.tar.xz -print -quit)
          test -n "$archive"
          # Validate the inner archive against the checksum from the successful build.
          checksum=$(find kwin-artifact -name SHA256SUMS -print -quit)
          expected=$(awk '{print $1}' "$checksum")
          echo "$expected  $archive" | sha256sum -c -
          cp "$archive" input/
          cp diagnostics/arch-mobile-rootfs/* input/
          cp diagnostics/arch-mobile-ci/package-candidate.json scripts/arch-mobile-session.sh input/
          python3 - <<'PY'
          import json
          json.dump({'kwin_run':41162670069,'kwin_source':'e8b39495de09e6b614004f99464f1620f89635b2','device_validated':False,'gpu_integration_complete':False},open('input/provenance.json','w'),indent=2)
          PY
          if [[ '${{ steps.desktop-cache.outputs.cache-hit }}' == 'true' ]]; then
            (cd .rootfs-checkpoint && sha256sum -c SHA256SUMS)
            sudo tar --zstd --numeric-owner -xpf .rootfs-checkpoint/desktop.tar.zst -C rootfs
            cp .rootfs-checkpoint/base-*.txt out/
          else
            curl -fL --retry 3 https://fl.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz -o base.tar.gz
            sha256sum base.tar.gz > out/base-sha256.txt
            sudo tar --numeric-owner -xpf base.tar.gz -C rootfs
          fi
          sudo chown root:root rootfs
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp -L /etc/resolv.conf rootfs/etc/resolv.conf
      - name: Install desktop dependencies on cache miss
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --mount --pid --fork --kill-child --propagation private \
            /bin/bash diagnostics/arch-mobile-rootfs/run-in-namespace.sh \
            rootfs input out .build-cache/pacman dependencies 2>&1 | tee out/dependencies.log
          mkdir -p .rootfs-checkpoint
          python3 diagnostics/arch-mobile-rootfs/check-no-build-mounts.py rootfs
          # The private namespace has exited; archive the unmounted guest tree.
          sudo tar --zstd --hard-dereference --numeric-owner --one-file-system \
            --exclude='./dev/*' --exclude='./proc/*' --exclude='./sys/*' \
            --exclude='./run/*' --exclude='./tmp/*' --exclude='./input' --exclude='./output' \
            --exclude='./etc/resolv.conf' --exclude='./var/cache/pacman/pkg/*' \
            -cpf .rootfs-checkpoint/desktop.tar.zst -C rootfs .
          cp out/base-*.txt .rootfs-checkpoint/
          (cd .rootfs-checkpoint && sha256sum desktop.tar.zst > SHA256SUMS)
      - name: Save installed desktop before KWin overlay and final packaging
        if: steps.desktop-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .rootfs-checkpoint
          key: ${{ steps.desktop-cache.outputs.cache-primary-key }}
      - name: Install matching desktop and reused KWin
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --mount --pid --fork --kill-child --propagation private \
            /bin/bash diagnostics/arch-mobile-rootfs/run-in-namespace.sh \
            rootfs input out .build-cache/pacman overlay 2>&1 | tee out/rootfs-install.log
          python3 scripts/arch-mobile-preflight.py rootfs > out/preflight.json
          python3 diagnostics/arch-mobile-rootfs/check-no-build-mounts.py rootfs
          sudo python3 diagnostics/arch-mobile-rootfs/normalize-runtime.py rootfs
          # Do not include build mounts or borrowed host resolver settings.
          sudo rm -f rootfs/etc/resolv.conf
          sudo tar --zstd --hard-dereference --numeric-owner --one-file-system \
            --exclude='./dev/*' --exclude='./proc/*' --exclude='./sys/*' \
            --exclude='./run/*' --exclude='./tmp/*' --exclude='./input' --exclude='./output' \
            --exclude='./var/cache/pacman/pkg/*' -cpf out/archohall-arch-mobile-experimental.tar.zst -C rootfs .
          sha256sum out/*.tar.zst > out/SHA256SUMS
      - name: Upload image and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch-mobile-rootfs-experimental-${{ github.run_id }}
          path: out/
          retention-days: 14
